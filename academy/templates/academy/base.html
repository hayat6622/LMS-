{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Jamia Ahsan ul uloom Mardan{% endblock %}</title>

  <!-- Tailwind CSS (via CDN for rapid development, adjust for prod later if needed) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter + Noto Nastaliq Urdu -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              dark: '#0D3B3F',
              teal: '#135058',
            },
            accent: {
              gold: '#D4AF37',
              light: '#E6C27A',
            },
            beige: '#F4EFE6',
            success: '#4ADE80',
          }
        }
      }
    }
  </script>
</head>

<body class="bg-beige text-primary-dark font-sans flex min-h-screen relative overflow-x-hidden">

  <!-- Global Layout Wrapper -->
  <div class="flex-1 flex flex-col w-full min-h-screen">

    <!-- Header -->
    <header
      class="h-20 px-6 bg-primary-dark border-b border-accent-gold/20 shadow-md flex justify-between items-center shrink-0 sticky top-0 z-50">
      <!-- Left Header: Logo -->
      <a href="{% url 'academy:dashboard' %}" class="flex items-center gap-4">
        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-lg transform rotate-3 hover:rotate-0 transition-transform overflow-hidden">
           <img src="{% static 'images/official_logo.jpg' %}" alt="Logo" class="w-full h-full object-cover">
        </div>
        <div class="flex flex-col justify-center">
          <span class="text-white text-xl font-black tracking-tight leading-tight" data-en="Jamia Ahsan ul uloom" data-ur="جامعہ احسن العلوم">Jamia Ahsan ul uloom</span>
          <span class="text-accent-light text-[10px] font-bold tracking-widest uppercase opacity-80" data-en="Mardan" data-ur="مردان">Mardan</span>
        </div>
      </a>

      <!-- Search -->
      <div class="relative w-96 group">
        <form action="{% url 'academy:directory' %}" method="GET" class="flex items-center">
          <input type="text" name="q" data-placeholder-en="Search scholars or staff..." data-placeholder-ur="طلباء یا عملے کو تلاش کریں..." placeholder="Search scholars or staff..."
            class="w-full ltr:pl-12 ltr:pr-4 rtl:pr-12 rtl:pl-4 py-2 bg-white/10 border border-white/20 rounded-2xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-accent-gold/50 transition-all font-medium">
          <button type="submit"
            class="absolute ltr:left-4 rtl:right-4 top-2 group-hover:text-accent-gold transition-colors text-white/40">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
        </form>
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-6">
        <!-- Language Toggle -->
        <button id="lang-toggle"
          class="relative text-white hover:text-accent-gold transition-all px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 shadow-lg font-bold text-xs flex items-center gap-2 cursor-pointer group uppercase tracking-widest">
          <svg class="w-4 h-4 text-accent-gold group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
          </svg>
          <span id="lang-label">اردو</span>
        </button>

        <!-- Notifications -->
        <button
          class="relative text-white/50 hover:text-accent-gold transition-all p-2 rounded-full hover:bg-white/10">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.432L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9">
            </path>
          </svg>
          <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full shadow-sm"></span>
        </button>

        <!-- Profile -->
        <a href="/admin/"
          class="flex items-center gap-3 ltr:pl-6 ltr:border-l rtl:pr-6 rtl:border-r border-white/10 hover:opacity-80 transition cursor-pointer group">
          <div class="ltr:text-right rtl:text-left hidden md:block">
            <div class="text-sm font-black text-white group-hover:text-accent-gold transition-colors" data-en="Admin User" data-ur="ایڈمن">Admin User</div>
            <div class="text-[10px] text-accent-light uppercase tracking-widest opacity-70" data-en="Administrator" data-ur="منتظم">Administrator</div>
          </div>
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-dark to-primary-teal text-white flex items-center justify-center font-bold shadow-md">
            A
          </div>
        </a>
      </div>
    </header>

    <!-- Main Content Wrapper -->
    <main class="flex-1 overflow-y-auto w-full relative">
      {% block content %}
      {% endblock content %}
    </main>
  </div>

  <!-- Language Toggle Script -->
  <script>
    (function() {
      const htmlRoot = document.getElementById('html-root');
      const langToggle = document.getElementById('lang-toggle');
      const langLabel = document.getElementById('lang-label');

      // Load saved language or default to English
      let currentLang = localStorage.getItem('lms-lang') || 'en';

      function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lms-lang', lang);

        if (lang === 'ur') {
          htmlRoot.setAttribute('lang', 'ur');
          htmlRoot.setAttribute('dir', 'rtl');
          document.body.style.fontFamily = "'Noto Nastaliq Urdu', 'Inter', sans-serif";
          langLabel.textContent = 'English';
        } else {
          htmlRoot.setAttribute('lang', 'en');
          htmlRoot.setAttribute('dir', 'ltr');
          document.body.style.fontFamily = "'Inter', sans-serif";
          langLabel.textContent = 'اردو';
        }

        // Swap all data-en/data-ur text (non-inputs)
        document.querySelectorAll('[data-en][data-ur]:not(select):not(input)').forEach(el => {
          el.textContent = el.getAttribute('data-' + lang);
        });

        // Swap placeholders
        document.querySelectorAll('[data-placeholder-en][data-placeholder-ur]').forEach(el => {
          el.setAttribute('placeholder', el.getAttribute('data-placeholder-' + lang));
        });
      }

      // Apply on page load
      applyLanguage(currentLang);

      // Toggle on click
      langToggle.addEventListener('click', function() {
        applyLanguage(currentLang === 'en' ? 'ur' : 'en');
      });
    })();
  </script>

  <!-- Scripts via blocks if needed -->
  {% block extra_js %}{% endblock %}
</body>

</html>
